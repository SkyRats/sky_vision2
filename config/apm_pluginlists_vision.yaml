# MAVROS plugin allowlist for ZED visual odometry pipeline.
# Only load the plugins needed for ZED ENU odom → ArduPilot EKF3.
/**:
  ros__parameters:
    plugin_allowlist:
      - sys_status
      - sys_time
      - command
      - local_position
      - global_position
      - home_position
      - imu
      - mocap_pose_estimate
      - vision_speed
